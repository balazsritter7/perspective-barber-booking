<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perspective Barber - Idopontfoglalas</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#0a0a0a;color:#f0f0f0;min-height:100vh}
    .header{text-align:center;padding:48px 20px 32px;border-bottom:1px solid #1e1e1e}
    .logo{font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#888;margin-bottom:10px}
    .header h1{font-size:28px;font-weight:300;letter-spacing:2px;color:#fff}
    .header p{margin-top:8px;color:#666;font-size:14px}
    .container{max-width:680px;margin:0 auto;padding:40px 20px 60px}
    .step{margin-bottom:36px;opacity:.35;pointer-events:none;transition:opacity .3s}
    .step.active{opacity:1;pointer-events:all}
    .step-label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#c9a96e;margin-bottom:12px}
    .step h2{font-size:20px;font-weight:300;margin-bottom:18px;color:#fff}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
    .grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
    .card{background:#141414;border:1px solid #2a2a2a;border-radius:8px;padding:16px;cursor:pointer;transition:all .2s;text-align:center}
    .card:hover{border-color:#c9a96e;background:#1a1a1a}
    .card.sel{border-color:#c9a96e;background:#1a1409}
    .card .nm{font-size:15px;font-weight:500;color:#fff}
    .card .sb{font-size:12px;color:#777;margin-top:4px}
    .date-row{display:flex;gap:10px;flex-wrap:wrap}
    .dbtn{background:#141414;border:1px solid #2a2a2a;border-radius:8px;padding:12px 18px;cursor:pointer;color:#f0f0f0;font-size:14px;transition:all .2s;white-space:nowrap}
    .dbtn:hover{border-color:#c9a96e}
    .dbtn.sel{border-color:#c9a96e;background:#1a1409}
    .dinput{background:#141414;border:1px solid #2a2a2a;border-radius:8px;padding:12px 16px;color:#f0f0f0;font-size:14px;width:200px;outline:none}
    .dinput:focus{border-color:#c9a96e}
    .sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
    .sbtn{background:#141414;border:1px solid #2a2a2a;border-radius:6px;padding:10px 6px;cursor:pointer;color:#f0f0f0;font-size:14px;text-align:center;transition:all .2s}
    .sbtn:hover{border-color:#c9a96e}
    .sbtn.sel{border-color:#c9a96e;background:#1a1409;color:#c9a96e}
    .fg{margin-bottom:16px}
    .fg label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#888;margin-bottom:8px}
    .finput{width:100%;background:#141414;border:1px solid #2a2a2a;border-radius:8px;padding:14px 16px;color:#f0f0f0;font-size:15px;outline:none}
    .finput:focus{border-color:#c9a96e}
    .btnp{width:100%;background:#c9a96e;color:#0a0a0a;border:none;border-radius:8px;padding:16px;font-size:15px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;margin-top:8px}
    .btnp:hover{background:#e0bf80}
    .btnp:disabled{background:#333;color:#666;cursor:not-allowed}
    .sumbox{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:24px;margin-bottom:24px}
    .sumrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #1e1e1e;font-size:14px}
    .sumrow:last-child{border-bottom:none}
    .sumrow .lbl{color:#777}
    .sumrow .val{color:#fff;font-weight:500}
    .succbox{text-align:center;padding:48px 20px}
    .succbox h2{font-size:24px;font-weight:300;color:#c9a96e;margin-bottom:8px}
    .loading{color:#888;font-size:14px;padding:16px 0}
    .errmsg{color:#e57373;font-size:13px;margin-top:8px}
    .divider{border:none;border-top:1px solid #1e1e1e;margin:36px 0}
    @media(max-width:480px){.grid{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="header">
  <div class="logo">Perspective</div>
  <h1>Idopontfoglalas</h1>
  <p>Pecs, Boszorkany utca 2/1 &middot; Kedd-Pentek 9-19h &middot; Szombat 10-17h</p>
</div>
<div class="container" id="app"></div>
<script>
var SHOP="6a27f69555573bf33956d108";
var BASE="https://superagent-fed7f9e2.base44.app";
var SVCS=[
  {id:"6a27f6b055573bf33956d118",name:"Hajvagas",dur:45,price:"5.500 Ft-tol"},
  {id:"6a27f6b055573bf33956d119",name:"Hosszu Hajvagas",dur:60,price:"7.500 Ft-tol"},
  {id:"6a27f6b055573bf33956d11a",name:"Hajvagas + Szakall",dur:60,price:""},
  {id:"6a27f6b055573bf33956d11b",name:"Hosszu haj + Szakall",dur:75,price:""},
  {id:"6a27f6b055573bf33956d11c",name:"Egy hossz + Szakall",dur:45,price:"3.000 Ft-tol"},
  {id:"6a27f6b055573bf33956d11d",name:"Szakall / Borotvales",dur:30,price:""}
];
var BARBERS=[
  {id:"6a27f6a355573bf33956d10c",name:"Mark"},
  {id:"6a27f6a355573bf33956d10d",name:"Milan"},
  {id:"6a27f6a355573bf33956d10e",name:"Kiki"},
  {id:"6a27f6a355573bf33956d10f",name:"Zalan"},
  {id:"6a27f6a355573bf33956d110",name:"Matyi"},
  {id:"6a27f6a355573bf33956d111",name:"Gergo"},
  {id:"6a27f6a355573bf33956d112",name:"Kolo"}
];
var st={step:1,svc:null,barber:null,date:null,slot:null,slots:[],loading:false,name:"",phone:"",email:"",booking:false,booked:false,err:""};

function getDates(){
  var days=[],dN=["Vas","Hetfo","Kedd","Szerda","Csut","Pentek","Szom"],mN=["jan","feb","mar","apr","maj","jun","jul","aug","szep","okt","nov","dec"],cl=[0,1];
  var d=new Date();d.setDate(d.getDate()+1);
  while(days.length<8){
    if(cl.indexOf(d.getDay())===-1){
      var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),dd=String(d.getDate()).padStart(2,"0");
      days.push({v:y+"-"+m+"-"+dd,l:dN[d.getDay()]+" "+d.getDate()+". "+mN[d.getMonth()]});
    }
    d.setDate(d.getDate()+1);
  }
  return days;
}

function loadSlots(){
  if(!st.date)return;
  st.loading=true;st.slots=[];render();
  var body={shop_id:SHOP,date:st.date};
  if(st.barber)body.barber_id=st.barber.id;
  fetch(BASE+"/functions/getAvailableSlots",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(data){
      var all=[];
      if(data.barbers){
        data.barbers.forEach(function(b){
          b.slots.forEach(function(s){all.push({time:s,bid:b.barber_id,bname:b.barber_name});});
        });
        all.sort(function(a,b){return a.time.localeCompare(b.time);});
      }
      st.slots=all;st.loading=false;render();
    })
    .catch(function(){st.slots=[];st.loading=false;render();});
}

function doBook(){
  st.booking=true;st.err="";render();
  var bid=st.barber?st.barber.id:st.slot.bid;
  fetch(BASE+"/functions/bookAppointment",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
    shop_id:SHOP,barber_id:bid,customer_name:st.name,customer_phone:st.phone,customer_email:st.email,service:st.svc.name,date:st.date,start_time:st.slot.time
  })})
  .then(function(r){return r.json();})
  .then(function(d){
    if(d.success){st.booked=true;}else{st.err=d.error||"Hiba tortent.";}
    st.booking=false;render();
  })
  .catch(function(){st.err="Kapcsolodasi hiba.";st.booking=false;render();});
}

function fmtDate(d){
  if(!d)return"";
  var dN=["Vasarnap","Hetfo","Kedd","Szerda","Csutortok","Pentek","Szombat"],mN=["januar","februar","marcius","aprilis","majus","junius","julius","augusztus","szeptember","oktober","november","december"];
  var dt=new Date(d+"T12:00:00");
  return dN[dt.getDay()]+", "+dt.getFullYear()+". "+mN[dt.getMonth()]+" "+dt.getDate()+".";
}

function E(tag,cls,html,click){
  return "<"+tag+(cls?" class=\""+cls+"\"":"")+(click?" onclick=\""+click+"\"":"")+">"+html+"</"+tag+">";
}

function render(){
  var a=document.getElementById("app"),h="";
  if(st.booked){
    a.innerHTML="<div class=\"succbox\"><div style=\"font-size:48px;margin-bottom:16px\">&#9986;</div><h2>Foglalas megerositve!</h2>"
      +"<p style=\"margin-top:16px;color:#aaa;line-height:1.8\"><strong style=\"color:#fff\">"+st.name+"</strong>, varunk teged<br>"
      +"<strong style=\"color:#c9a96e\">"+fmtDate(st.date)+", "+st.slot.time+"</strong><br>"
      +"Borbelyed: <strong style=\"color:#fff\">"+st.slot.bname+"</strong><br>"
      +"Szolgaltatas: <strong style=\"color:#fff\">"+st.svc.name+"</strong></p>"
      +"<button class=\"btnp\" style=\"margin-top:32px;max-width:240px\" onclick=\"location.reload()\">Uj foglalas</button></div>";
    return;
  }
  var dates=getDates();

  // Step 1 - Szolgaltatas
  h+="<div class=\"step active\"><div class=\"step-label\">01 &mdash; Szolgaltatas</div><h2>Milyen szolgaltatast keresz?</h2><div class=\"grid3\">";
  for(var i=0;i<SVCS.length;i++){
    var s=SVCS[i],sel=st.svc&&st.svc.id===s.id?" sel":"";
    h+="<div class=\"card"+sel+"\" onclick=\"selSvc('"+s.id+"')\"><div class=\"nm\">"+s.name+"</div><div class=\"sb\">"+s.dur+" perc"+(s.price?" &middot; "+s.price:"")+"</div></div>";
  }
  h+="</div></div><hr class=\"divider\">";

  // Step 2 - Borbelyed
  h+="<div class=\"step"+(st.step>=2?" active":"")+"\" id=\"s2\"><div class=\"step-label\">02 &mdash; Borbelyed</div><h2>Kit valasztasz?</h2><div class=\"grid\">";
  h+="<div class=\"card"+(!st.barber?" sel":"")+"\" onclick=\"selBarber(null)\"><div class=\"nm\">Mindegy</div><div class=\"sb\">Elso szabad</div></div>";
  for(var j=0;j<BARBERS.length;j++){
    var b=BARBERS[j],bsel=st.barber&&st.barber.id===b.id?" sel":"";
    h+="<div class=\"card"+bsel+"\" onclick=\"selBarber('"+b.id+"')\"><div class=\"nm\">"+b.name+"</div></div>";
  }
  h+="</div></div><hr class=\"divider\">";

  // Step 3 - Datum
  h+="<div class=\"step"+(st.step>=3?" active":"")+"\" id=\"s3\"><div class=\"step-label\">03 &mdash; Datum</div><h2>Mikor jossz?</h2><div class=\"date-row\" style=\"margin-bottom:12px\">";
  for(var k=0;k<dates.length;k++){
    var dd=dates[k],dsel=st.date===dd.v?" sel":"";
    h+="<button class=\"dbtn"+dsel+"\" onclick=\"selDate('"+dd.v+"')\">"+dd.l+"</button>";
  }
  h+="</div><div style=\"display:flex;align-items:center;gap:12px;margin-top:8px\">";
  h+="<span style=\"color:#666;font-size:13px\">Vagy:</span>";
  h+="<input type=\"date\" class=\"dinput\" value=\""+(st.date||"")+"\" onchange=\"selDate(this.value)\" min=\""+new Date().toISOString().split("T")[0]+"\"></div>";
  if(st.loading)h+="<p class=\"loading\">Szabad idopontok betoltese...</p>";
  if(!st.loading&&st.date&&st.slots.length===0)h+="<p class=\"loading\" style=\"color:#e57373;margin-top:16px\">Ezen a napon nincs szabad idopont.</p>";
  if(!st.loading&&st.slots.length>0){
    h+="<div style=\"margin-top:20px\"><div style=\"font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:12px\">Szabad idopontok</div><div class=\"sgrid\">";
    for(var l=0;l<st.slots.length;l++){
      var sl=st.slots[l],ssel=st.slot&&st.slot.time===sl.time&&st.slot.bid===sl.bid?" sel":"";
      h+="<div class=\"sbtn"+ssel+"\" onclick=\"selSlot('"+sl.time+"','"+sl.bid+"','"+sl.bname+"')\">"+sl.time+"</div>";
    }
    h+="</div></div>";
  }
  h+="</div><hr class=\"divider\">";

  // Step 4 - Adatok
  h+="<div class=\"step"+(st.step>=4?" active":"")+"\" id=\"s4\"><div class=\"step-label\">04 &mdash; Adataid</div><h2>Kinek foglaljuk?</h2>";
  h+="<div class=\"fg\"><label>Neved *</label><input class=\"finput\" type=\"text\" placeholder=\"pl. Kovacs Peter\" value=\""+st.name+"\" oninput=\"st.name=this.value\"></div>";
  h+="<div class=\"fg\"><label>Telefonszam *</label><input class=\"finput\" type=\"tel\" placeholder=\"+36 30 123 4567\" value=\""+st.phone+"\" oninput=\"st.phone=this.value\"></div>";
  h+="<div class=\"fg\"><label>Email (opcionalis)</label><input class=\"finput\" type=\"email\" placeholder=\"pelda@email.com\" value=\""+st.email+"\" oninput=\"st.email=this.value\"></div>";
  if(st.slot){
    h+="<div class=\"sumbox\" style=\"margin-top:24px\">";
    h+="<div class=\"sumrow\"><span class=\"lbl\">Szolgaltatas</span><span class=\"val\">"+(st.svc?st.svc.name:"&ndash;")+"</span></div>";
    h+="<div class=\"sumrow\"><span class=\"lbl\">Borbelyed</span><span class=\"val\">"+st.slot.bname+"</span></div>";
    h+="<div class=\"sumrow\"><span class=\"lbl\">Datum</span><span class=\"val\">"+fmtDate(st.date)+"</span></div>";
    h+="<div class=\"sumrow\"><span class=\"lbl\">Idopont</span><span class=\"val\">"+st.slot.time+"</span></div>";
    h+="</div>";
  }
  if(st.err)h+="<p class=\"errmsg\">"+st.err+"</p>";
  var dis=st.booking||!st.slot||!st.name||!st.phone;
  h+="<button class=\"btnp\" onclick=\"doBook()\""+(dis?" disabled":"")+">"+(st.booking?"Foglalas folyamatban...":"Idopont foglalasa &rarr;")+"</button>";
  h+="<p style=\"font-size:12px;color:#555;margin-top:12px;text-align:center\">Foglalasod utan munkatarsunk visszahiv megerositeskent.</p>";
  h+="</div>";
  a.innerHTML=h;
}

function selSvc(id){for(var i=0;i<SVCS.length;i++){if(SVCS[i].id===id){st.svc=SVCS[i];break;}}if(st.step<2)st.step=2;render();}
function selBarber(id){if(!id){st.barber=null;}else{for(var i=0;i<BARBERS.length;i++){if(BARBERS[i].id===id){st.barber=BARBERS[i];break;}}}if(st.step<3)st.step=3;if(st.date)loadSlots();else render();}
function selDate(v){if(!v)return;st.date=v;st.slot=null;if(st.step<3)st.step=3;loadSlots();}
function selSlot(t,bid,bn){st.slot={time:t,bid:bid,bname:bn};if(st.step<4)st.step=4;render();}

render();
</script>
</body>
</html>
